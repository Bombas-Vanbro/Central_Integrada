<!DOCTYPE html>
<html lang="pt-BR">
<head> 

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Central Integrada</title>


<!-- FAVICON -->

<link
    rel="icon"
    type="image/png"
    href="./favicon.png"
>

<link
    rel="shortcut icon"
    type="image/png"
    href="./favicon.png"
>


<!-- BOOTSTRAP -->

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
>


<!-- BOOTSTRAP ICONS -->

<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
>


<style>


    /* =====================================
       CONFIGURAÇÕES GERAIS
    ====================================== */

    * {
        box-sizing: border-box;
    }


    body {
        margin: 0;

        font-family:
            Arial,
            Helvetica,
            sans-serif;

        background: #f1f4f8;

        overflow: hidden;
    }


    /* =====================================
       CONTAINER PRINCIPAL
    ====================================== */

    .app-container {

        display: flex;

        width: 100vw;

        height: 100vh;
    }


    /* =====================================
       BARRA LATERAL
    ====================================== */

    .sidebar {

        width: 302px;

        height: 100vh;

        background: #1e2a4a;

        color: white;

        display: flex;

        flex-direction: column;

        flex-shrink: 0;

        box-shadow:
            3px 0 10px rgba(0, 0, 0, 0.12);

        z-index: 10;

        transition:
            width 0.25s ease;
    }


    /* BARRA RECOLHIDA */

    .sidebar.collapsed {

        width: 76px;
    }


    /* =====================================
       CABEÇALHO DA BARRA
    ====================================== */

    .sidebar-header {

        padding: 18px 20px;

        border-bottom:
            1px solid rgba(255, 255, 255, 0.15);

        position: relative;

        transition:
            padding 0.25s ease;
    }


    .sidebar.collapsed .sidebar-header {

        padding: 18px 10px;
    }


    /* =====================================
       MARCA
    ====================================== */

    .brand {

        display: flex;

        align-items: center;

        gap: 12px;
    }


    /* =====================================
       BOTÃO HOME
    ====================================== */

    .home-button {

        width: 45px;

        height: 45px;

        padding: 0;

        border: none;

        background:
            rgba(255, 255, 255, 0.15);

        color: white;

        border-radius: 10px;

        display: flex;

        align-items: center;

        justify-content: center;

        font-size: 22px;

        cursor: pointer;

        transition:
            all 0.2s ease;

        flex-shrink: 0;
    }


    .home-button:hover {

        background: white;

        color: #1b4079;

        transform: scale(1.04);
    }


    .home-button:active {

        transform: scale(0.98);
    }


    /* =====================================
       TÍTULO
    ====================================== */

    .brand-title {

        font-size: 19px;

        font-weight: 700;

        margin: 0;

        white-space: nowrap;
    }


    .brand-subtitle {

        font-size: 11px;

        opacity: 0.75;

        margin-top: 2px;

        white-space: nowrap;
    }


    /* =====================================
       BOTÃO RECOLHER
    ====================================== */

    .collapse-button {

        width: 30px;

        height: 30px;

        padding: 0;

        border: none;

        background:
            rgba(255, 255, 255, 0.10);

        color:
            rgba(255, 255, 255, 0.85);

        border-radius: 7px;

        display: flex;

        align-items: center;

        justify-content: center;

        cursor: pointer;

        transition:
            all 0.2s ease;

        margin-left: auto;

        flex-shrink: 0;
    }


    .collapse-button:hover {

        background: white;

        color: #1b4079;
    }


    /* =====================================
       BOTÃO EXPANDIR
    ====================================== */

    .expand-button {

        display: none;

        width: 38px;

        height: 34px;

        margin:
            10px auto 0;

        padding: 0;

        border: none;

        background:
            rgba(255, 255, 255, 0.10);

        color:
            rgba(255, 255, 255, 0.90);

        border-radius: 8px;

        align-items: center;

        justify-content: center;

        font-size: 16px;

        cursor: pointer;

        transition:
            all 0.2s ease;
    }


    .expand-button:hover {

        background: white;

        color: #1b4079;
    }


    /* =====================================
       ESTADO RECOLHIDO
    ====================================== */

    .sidebar.collapsed .brand {

        justify-content: center;
    }


    .sidebar.collapsed .brand > div {

        display: none;
    }


    .sidebar.collapsed .home-button {

        margin: 0 auto;
    }


    .sidebar.collapsed .collapse-button {

        display: none;
    }


    .sidebar.collapsed .expand-button {

        display: flex;
    }


    /* =====================================
       TÍTULO DO MENU
    ====================================== */

    .menu-title {

        padding:
            22px 20px 10px;

        font-size: 11px;

        font-weight: 700;

        text-transform: uppercase;

        letter-spacing: 1px;

        opacity: 0.6;

        white-space: nowrap;

        transition:
            all 0.2s ease;
    }


    /* MODO RECOLHIDO */

    .sidebar.collapsed .menu-title {

        text-align: center;

        padding-left: 0;

        padding-right: 0;

        font-size: 0;
    }


    .sidebar.collapsed .menu-title::after {

        content: "•";

        font-size: 16px;

        opacity: 0.6;
    }


    /* =====================================
       MENU
    ====================================== */

    .menu {

        padding:
            0 12px;

        overflow-y: auto;

        overflow-x: hidden;
    }


    /* =====================================
       ITEM DO MENU
    ====================================== */

    .menu-item {

        width: 100%;

        border: none;

        background: transparent;

        color:
            rgba(255, 255, 255, 0.82);

        padding:
            13px 14px;

        margin-bottom: 5px;

        border-radius: 8px;

        display: flex;

        align-items: center;

        gap: 12px;

        text-align: left;

        cursor: pointer;

        transition:
            all 0.2s ease;

        font-size: 14px;
    }


    .menu-item i {

        font-size: 18px;

        width: 22px;

        text-align: center;

        flex-shrink: 0;
    }


    .menu-item span {

        white-space: nowrap;

        overflow: hidden;
    }


    /* =====================================
       ORDENAÇÃO DOS ITENS DO MENU
    ====================================== */

    .menu-item {
        user-select: none;
    }

    .menu-item.dragging {
        opacity: 0.45;
    }

    .menu-item.drag-over {
        position: relative;
    }

    .menu-item.drag-over::after {
        content: "";
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: -3px;
        height: 3px;
        background: #9fc5ed;
        border-radius: 3px;
        box-shadow: 0 0 6px rgba(159, 197, 237, 0.45);
        pointer-events: none;
    }


    .menu-item:hover {

        background:
            rgba(255, 255, 255, 0.10);

        color: white;
    }


    /* =====================================
       ITEM SELECIONADO
    ====================================== */

    .menu-item.active {

        background: #1a304c;

        color: white;

        font-weight: 400;

        border: 1px solid #1a304c;

        box-shadow:
            inset 2px 2px 5px rgba(255, 255, 255, 0.16),
            inset -2px -2px 5px rgba(0, 0, 0, 0.10),
            0 3px 8px rgba(0, 0, 0, 0.20);

        position: relative;

    }


    /* LISTRINHA LATERAL DO ITEM SELECIONADO */

    .menu-item.active::before {

        content: "";

        position: absolute;

        left: -1px;

        top: 7px;

        bottom: 7px;

        width: 4px;

        background: #9fc5ed;

        border-radius:
            0 4px 4px 0;

        box-shadow:
            0 0 6px rgba(159, 197, 237, 0.45);

    }


    /* =====================================
       MENU RECOLHIDO
    ====================================== */

    .sidebar.collapsed .menu {

        padding-left: 10px;

        padding-right: 10px;
    }


    .sidebar.collapsed .menu-item {

        justify-content: center;

        padding:
            13px 0;

        gap: 0;
    }


    .sidebar.collapsed .menu-item span {

        display: none;
    }


    .sidebar.collapsed .menu-item i {

        width: auto;
    }


    /* =====================================
       RODAPÉ
    ====================================== */

    .sidebar-footer {

        margin-top: auto;

        padding:
            16px 20px;

        border-top:
            1px solid rgba(255, 255, 255, 0.15);

        font-size: 11px;

        opacity: 0.65;

        text-align: center;

        white-space: nowrap;

        overflow: hidden;
    }


    .sidebar.collapsed .sidebar-footer {

        padding:
            16px 5px;

        font-size: 0;
    }


    .sidebar.collapsed .sidebar-footer::before {

        content: "CI";

        font-size: 11px;

        font-weight: 600;
    }


    /* =====================================
       ÁREA PRINCIPAL
    ====================================== */

    .main-content {

        flex: 1;

        height: 100vh;

        display: flex;

        flex-direction: column;

        min-width: 0;
    }


    /* =====================================
       TOPBAR
    ====================================== */

    .topbar {

        height: 68px;

        background: white;

        border-bottom:
            1px solid #dee2e6;

        display: flex;

        align-items: center;

        justify-content: space-between;

        padding:
            0 22px;

        flex-shrink: 0;
    }


    .current-system {

        display: flex;

        align-items: center;

        gap: 10px;

        min-width: 0;
    }


    .current-icon {

        color: #1b4079;

        font-size: 20px;

        flex-shrink: 0;
    }


    .current-info {

        display: flex;

        flex-direction: column;

        justify-content: center;

        min-width: 0;
    }


    .current-name {

        font-size: 16px;

        font-weight: 600;

        color: #263238;

        line-height: 1.2;
    }


    .current-description {

        display: none;

        font-size: 11px;

        color: #7a828a;

        margin-top: 3px;

        line-height: 1.2;

        white-space: nowrap;

        overflow: hidden;

        text-overflow: ellipsis;
    }


    .home-mode .current-description {

        display: block;
    }


    /* =====================================
       BOTÕES TOPBAR
    ====================================== */

    .topbar-actions {

        display: flex;

        gap: 8px;

        flex-shrink: 0;
    }


    .topbar-btn {

        border:
            1px solid #d9dee5;

        background: white;

        color: #495057;

        border-radius: 7px;

        padding:
            7px 11px;

        cursor: pointer;

        transition: 0.2s;
    }


    .topbar-btn:hover {

        background: #f1f4f8;

        color: #1b4079;
    }


    /* =====================================
       ÁREA DO CONTEÚDO
    ====================================== */

    .content-area {

        flex: 1;

        padding: 12px;

        min-height: 0;
    }


    .iframe-container {

        width: 100%;

        height: 100%;

        background: white;

        border-radius: 8px;

        overflow: hidden;

        box-shadow:
            0 2px 8px rgba(0, 0, 0, 0.07);

        position: relative;
    }


    #systemFrame {

        width: 100%;

        height: 100%;

        border: none;

        display: block;
    }


    /* =====================================
       TELA INICIAL
    ====================================== */

    .welcome-screen {

        position: absolute;

        inset: 0;

        background: white;

        display: flex;

        align-items: center;

        justify-content: center;

        text-align: center;

        overflow: hidden;

        z-index: 2;
    }


    .welcome-logo {

        position: absolute;

        left: 50%;

        top: 50%;

        transform:
            translate(-50%, -50%);

        width:
            min(65%, 520px);

        max-height: 65%;

        object-fit: contain;

        opacity: 0.09;

        pointer-events: none;

        user-select: none;
    }


    .welcome-content {

        position: relative;

        z-index: 2;

        pointer-events: none;
    }


    /* =====================================
       LOADING
    ====================================== */

    .loading {

        position: absolute;

        inset: 0;

        background:
            rgba(255, 255, 255, 0.90);

        display: none;

        align-items: center;

        justify-content: center;

        z-index: 5;
    }


    .loading.active {

        display: flex;
    }


    .loading-content {

        text-align: center;

        color: #1b4079;
    }


    .loading-content .spinner-border {

        width: 35px;

        height: 35px;

        margin-bottom: 12px;
    }


    .loading-content div {

        font-size: 13px;
    }


    /* =====================================
       BOTÃO MENU MOBILE
    ====================================== */

    .mobile-menu-btn {

        display: none;

        border: none;

        background: transparent;

        font-size: 22px;

        color: #1b4079;

        margin-right: 10px;
    }


    /* =====================================
       RESPONSIVIDADE
    ====================================== */

    @media (max-width: 900px) {

        .sidebar {

            width: 230px;
        }


        .sidebar.collapsed {

            width: 76px;
        }


        .brand-title {

            font-size: 16px;
        }


        .menu-item {

            font-size: 13px;
        }

    }


    /* =====================================
       CELULAR
    ====================================== */

    @media (max-width: 700px) {

        body {

            overflow: auto;
        }


        .app-container {

            height: auto;

            min-height: 100vh;
        }


        .sidebar {

            position: fixed;

            left: -280px;

            top: 0;

            width: 280px;

            transition:
                left 0.3s ease;

            z-index: 1000;
        }


        /* No celular a barra não fica estreita */

        .sidebar.collapsed {

            width: 280px;
        }


        .sidebar.open {

            left: 0;
        }


        /* Restaura aparência normal */

        .sidebar.collapsed .sidebar-header {

            padding:
                18px 20px;
        }


        .sidebar.collapsed .brand {

            justify-content: flex-start;
        }


        .sidebar.collapsed .brand > div {

            display: block;
        }


        .sidebar.collapsed .home-button {

            margin: 0;
        }


        .sidebar.collapsed .collapse-button {

            display: flex;
        }


        .sidebar.collapsed .expand-button {

            display: none;
        }


        .sidebar.collapsed .menu-title {

            text-align: left;

            padding-left: 20px;

            padding-right: 20px;

            font-size: 11px;
        }


        .sidebar.collapsed .menu-title::after {

            display: none;
        }


        .sidebar.collapsed .menu {

            padding-left: 12px;

            padding-right: 12px;
        }


        .sidebar.collapsed .menu-item {

            justify-content: flex-start;

            padding:
                13px 14px;

            gap: 12px;
        }


        .sidebar.collapsed .menu-item span {

            display: inline;
        }


        .sidebar.collapsed .menu-item i {

            width: 22px;
        }


        .sidebar.collapsed .sidebar-footer {

            padding:
                16px 20px;

            font-size: 11px;
        }


        .sidebar.collapsed .sidebar-footer::before {

            display: none;
        }


        .main-content {

            width: 100%;

            height: 100vh;
        }


        .mobile-menu-btn {

            display: block;
        }


        .current-name {

            font-size: 14px;
        }


        .current-description {

            font-size: 10px;

            max-width: 230px;
        }


        .topbar {

            padding:
                0 12px;
        }


        .content-area {

            padding: 7px;
        }


        .welcome-logo {

            width: 75%;

            opacity: 0.08;
        }

    }


</style>

</head>

<body>

<div class="app-container">


<!-- =====================================
     MENU LATERAL
====================================== -->

<aside
    class="sidebar"
    id="sidebar"
>


    <!-- CABEÇALHO -->

    <div class="sidebar-header">


        <div class="brand">


            <!-- BOTÃO HOME -->

            <button
                class="home-button"
                title="Página inicial"
                aria-label="Página inicial"
                onclick="goHome()"
            >

                <i class="bi bi-grid-1x2-fill"></i>

            </button>


            <!-- TÍTULO -->

            <div>

                <div class="brand-title">
                    Central Integrada
                </div>


                <div class="brand-subtitle">
                    Sistemas e Ferramentas
                </div>

            </div>


            <!-- BOTÃO RECOLHER -->

            <button
                class="collapse-button"
                id="collapseButton"
                title="Recolher menu"
                aria-label="Recolher menu"
                onclick="toggleSidebarCollapse()"
            >

                <i class="bi bi-chevron-left"></i>

            </button>


        </div>


        <!-- BOTÃO EXPANDIR -->

        <button
            class="expand-button"
            id="expandButton"
            title="Expandir menu"
            aria-label="Expandir menu"
            onclick="toggleSidebarCollapse()"
        >

            <i class="bi bi-chevron-right"></i>

        </button>


    </div>


    <!-- TÍTULO DO MENU -->

    <div class="menu-title">
        Sistemas
    </div>


    <!-- =====================================
         SISTEMAS
    ====================================== -->

    <div class="menu">


        <!-- AGENDA DE TREINAMENTOS -->

        <button
            class="menu-item"
            data-name="Agenda de Treinamentos"
            data-url="https://bombas-vanbro.github.io/Agenda-de-Treinamentos/"
            data-icon="bi-mortarboard-fill"
            onclick="openSystem(this)"
            title="Agenda de Treinamentos"
        >

            <i class="bi bi-mortarboard-fill"></i>

            <span>
                Agenda de Treinamentos
            </span>

        </button>


        <!-- AGENDA DE TAREFAS - ENGENHARIA -->

        <button
            class="menu-item"
            data-name="Agenda de Tarefas - Engenharia"
            data-url="https://bombas-vanbro.github.io/Agenda-de-Tarefas-Engenharia-/"
            data-icon="bi-kanban-fill"
            onclick="openSystem(this)"
            title="Agenda de Tarefas - Engenharia"
        >

            <i class="bi bi-kanban-fill"></i>

            <span>
                Agenda de Tarefas - Engenharia
            </span>

        </button>


        <!-- DASHBOARD DE QUALIDADE -->

        <button
            class="menu-item"
            data-name="Dashboard de Qualidade"
            data-url="https://bombas-vanbro.github.io/dashboard-qualidade/"
            data-icon="bi-bar-chart-fill"
            onclick="openSystem(this)"
            title="Dashboard de Qualidade"
        >

            <i class="bi bi-bar-chart-fill"></i>

            <span>
                Dashboard de Qualidade
            </span>

        </button>


        <!-- INSPEÇÃO DE MATÉRIA-PRIMA -->

        <button
            class="menu-item"
            data-name="Inspeção de Matéria-Prima"
            data-url="https://script.google.com/macros/s/AKfycbxuCS2ZU6lDfzUB5LWGW3t67I4EldDN2JV4pYnQWxNqqxKVaq1S1KUKJewVfEyKYTMY/exec"
            data-icon="bi-clipboard2-check-fill"
            onclick="openSystem(this)"
            title="Inspeção de Matéria-Prima"
        >

            <i class="bi bi-clipboard2-check-fill"></i>

            <span>
                Inspeção de Matéria-Prima
            </span>

        </button>


        <!-- CONTROLE DE MATERIAIS - BOBINAGEM -->

        <button
            class="menu-item"
            data-name="Controle de Materiais - Bobinagem"
            data-url="https://bombas-vanbro.github.io/Controle-de-Materiais_Bobinagem/"
            data-icon="bi-box-seam-fill"
            onclick="openSystem(this)"
            title="Controle de Materiais - Bobinagem"
        >

            <i class="bi bi-box-seam-fill"></i>

            <span>
                Controle de Materiais - Bobinagem
            </span>

        </button>


        <!-- PROCEDIMENTOS DE TRABALHO -->

        <button
            class="menu-item"
            data-name="Procedimentos de Trabalho"
            data-url="https://bombas-vanbro.github.io/Procedimentos-de-Trabalho/"
            data-icon="bi-file-earmark-text-fill"
            onclick="openSystem(this)"
            title="Procedimentos de Trabalho"
        >

            <i class="bi bi-file-earmark-text-fill"></i>

            <span>
                Procedimentos de Trabalho
            </span>

        </button>


        <!-- CONTRATOS E LICITAÇÕES -->

        <button
            class="menu-item"
            data-name="Contratos e Licitações"
            data-url="https://bombas-vanbro.github.io/Controle-de-Contratos-e-Licita-es-/"
            data-icon="bi-briefcase-fill"
            onclick="openSystem(this)"
            title="Contratos e Licitações"
        >

            <i class="bi bi-briefcase-fill"></i>

            <span>
                Contratos e Licitações
            </span>

        </button>


        <!-- CONTROLE DE PEDIDOS - AEGEA -->

        <button
            class="menu-item"
            data-name="Controle de Pedidos - AEGEA"
            data-url="https://bombas-vanbro.github.io/Controle-de-Pedidos---AEGEA/"
            data-icon="bi-truck"
            onclick="openSystem(this)"
            title="Controle de Pedidos - AEGEA"
        >

            <i class="bi bi-truck"></i>

            <span>
                Controle de Pedidos - AEGEA
            </span>

        </button>


    </div>


    <!-- =====================================
         RODAPÉ
    ====================================== -->

    <div class="sidebar-footer">

        Central Integrada<br>

        <span>
            Sistemas Internos - Bombas Vanbro Ltda
        </span>

    </div>


</aside>


<!-- =====================================
     ÁREA PRINCIPAL
====================================== -->

<main class="main-content">


    <!-- TOPBAR -->

    <header class="topbar">


        <div
            class="current-system home-mode"
            id="currentSystem"
        >


            <!-- MENU MOBILE -->

            <button
                class="mobile-menu-btn"
                onclick="toggleSidebar()"
            >

                <i class="bi bi-list"></i>

            </button>


            <!-- ÍCONE -->

            <i
                id="currentIcon"
                class="bi bi-grid-1x2-fill current-icon"
            ></i>


            <!-- INFORMAÇÕES -->

            <div class="current-info">

                <span
                    id="currentName"
                    class="current-name"
                >
                    Central Integrada
                </span>


                <span
                    id="currentDescription"
                    class="current-description"
                >
                    Selecione uma ferramenta no menu lateral para começar
                </span>

            </div>


        </div>


        <!-- BOTÕES DA TOPBAR -->

        <div class="topbar-actions">


            <!-- ATUALIZAR -->

            <button
                class="topbar-btn"
                title="Atualizar sistema"
                onclick="reloadSystem()"
            >

                <i class="bi bi-arrow-clockwise"></i>

            </button>


            <!-- NOVA ABA -->

            <button
                class="topbar-btn"
                title="Abrir em nova aba"
                onclick="openNewTab()"
            >

                <i class="bi bi-box-arrow-up-right"></i>

            </button>


        </div>


    </header>


    <!-- =====================================
         ÁREA DO SISTEMA
    ====================================== -->

    <section class="content-area">


        <div class="iframe-container">


            <!-- TELA INICIAL -->

            <div
                id="welcomeScreen"
                class="welcome-screen"
            >


                <!-- LOGO COMO MARCA D'ÁGUA -->

                <img
                    src="./logo.png"
                    alt="Logo da empresa"
                    class="welcome-logo"
                >


                <div class="welcome-content"></div>


            </div>


            <!-- LOADING -->

            <div
                id="loading"
                class="loading"
            >


                <div class="loading-content">


                    <div
                        class="spinner-border"
                        role="status"
                    ></div>


                    <div>
                        Carregando sistema...
                    </div>


                </div>


            </div>


            <!-- IFRAME -->

            <iframe
                id="systemFrame"
                title="Sistema"
                src="about:blank"
            ></iframe>


        </div>


    </section>


</main>

</div>

<script>

/* =====================================
   SISTEMA ATUAL
====================================== */

let currentUrl = "";

let menuItemFoiArrastado = false;


/* Acrescenta um parâmetro de versão para sempre
   buscar a versão mais nova (evita cache do iframe) */

function comVersao(url) {

    return url +
        (url.includes("?") ? "&" : "?") +
        "v=" + Date.now();

}


/* =====================================
   ABRIR SISTEMA
====================================== */

function openSystem(button) {

    if (menuItemFoiArrastado) {
        menuItemFoiArrastado = false;
        return;
    }


    const url =
        button.dataset.url;


    const name =
        button.dataset.name;


    const icon =
        button.dataset.icon;


    if (!url) {


        alert(
            'O sistema "' +
            name +
            '" ainda não possui um link configurado.'
        );


        return;

    }


    currentUrl = url;


    /* Remove seleção anterior */

    document
        .querySelectorAll(".menu-item")
        .forEach(item => {

            item.classList.remove("active");

        });


    /* Seleciona sistema */

    button.classList.add("active");


    /* Atualiza nome */

    document
        .getElementById("currentName")
        .textContent = name;


    /* Sai do modo inicial */

    document
        .getElementById("currentSystem")
        .classList.remove("home-mode");


    /* Atualiza ícone */

    const currentIcon =
        document.getElementById("currentIcon");


    currentIcon.className =
        "bi " +
        icon +
        " current-icon";


    /* Esconde tela inicial */

    document
        .getElementById("welcomeScreen")
        .style.display = "none";


    /* Mostra carregamento */

    document
        .getElementById("loading")
        .classList.add("active");


    /* Carrega sistema */

    const frame =
        document.getElementById("systemFrame");


    frame.src = comVersao(url);


    frame.onload = function() {


        document
            .getElementById("loading")
            .classList.remove("active");

    };


    /* Fecha menu mobile */

    document
        .getElementById("sidebar")
        .classList.remove("open");

}


/* =====================================
   VOLTAR PARA PÁGINA INICIAL
====================================== */

function goHome() {


    currentUrl = "";


    /* Remove seleção */

    document
        .querySelectorAll(".menu-item")
        .forEach(item => {

            item.classList.remove("active");

        });


    /* Nome */

    document
        .getElementById("currentName")
        .textContent =
            "Central Integrada";


    /* Modo inicial */

    document
        .getElementById("currentSystem")
        .classList.add("home-mode");


    /* Ícone */

    document
        .getElementById("currentIcon")
        .className =
            "bi bi-grid-1x2-fill current-icon";


    /* Limpa iframe */

    document
        .getElementById("systemFrame")
        .src =
            "about:blank";


    /* Mostra tela inicial */

    document
        .getElementById("welcomeScreen")
        .style.display =
            "flex";


    /* Esconde loading */

    document
        .getElementById("loading")
        .classList.remove("active");


    /* Fecha menu mobile */

    document
        .getElementById("sidebar")
        .classList.remove("open");

}


/* =====================================
   RECOLHER / EXPANDIR BARRA LATERAL
====================================== */

function toggleSidebarCollapse() {


    const sidebar =
        document.getElementById("sidebar");


    const isCollapsed =
        sidebar.classList.contains("collapsed");


    if (isCollapsed) {


        /* EXPANDIR */

        sidebar.classList.remove(
            "collapsed"
        );


        document
            .getElementById("collapseButton")
            .title =
                "Recolher menu";


        document
            .getElementById("collapseButton")
            .setAttribute(
                "aria-label",
                "Recolher menu"
            );


    } else {


        /* RECOLHER */

        sidebar.classList.add(
            "collapsed"
        );


        document
            .getElementById("expandButton")
            .title =
                "Expandir menu";


        document
            .getElementById("expandButton")
            .setAttribute(
                "aria-label",
                "Expandir menu"
            );

    }

}


/* =====================================
   ORDENAR ITENS DO MENU
====================================== */

const MENU_ORDEM_STORAGE = "centralIntegrada_menuOrdem";

function configurarOrdenacaoMenu() {

    const menu = document.querySelector(".menu");

    if (!menu) {
        return;
    }

    menu.querySelectorAll(".menu-item").forEach(item => {

        item.setAttribute("draggable", "true");

        item.addEventListener("dragstart", function(event) {

            menuItemFoiArrastado = true;
            item.classList.add("dragging");

            event.dataTransfer.effectAllowed = "move";
            event.dataTransfer.setData(
                "text/plain",
                item.dataset.url || item.dataset.name || ""
            );

        });

        item.addEventListener("dragend", function() {

            item.classList.remove("dragging");

            menu.querySelectorAll(".menu-item").forEach(outroItem => {
                outroItem.classList.remove("drag-over");
            });

        });

        item.addEventListener("dragover", function(event) {

            event.preventDefault();

            const dragging = menu.querySelector(".menu-item.dragging");

            if (!dragging || dragging === item) {
                return;
            }

            event.dataTransfer.dropEffect = "move";

            menu.querySelectorAll(".menu-item").forEach(outroItem => {
                outroItem.classList.remove("drag-over");
            });

            item.classList.add("drag-over");

        });

        item.addEventListener("dragleave", function(event) {

            if (!item.contains(event.relatedTarget)) {
                item.classList.remove("drag-over");
            }

        });

        item.addEventListener("drop", function(event) {

            event.preventDefault();

            const dragging = menu.querySelector(".menu-item.dragging");

            if (!dragging || dragging === item) {
                return;
            }

            const rect = item.getBoundingClientRect();

            const inserirAntes =
                event.clientY < rect.top + (rect.height / 2);

            if (inserirAntes) {
                menu.insertBefore(dragging, item);
            } else {
                menu.insertBefore(dragging, item.nextSibling);
            }

            item.classList.remove("drag-over");

            salvarOrdemMenu();

        });

    });

    restaurarOrdemMenu();

}


function salvarOrdemMenu() {

    const menu = document.querySelector(".menu");

    if (!menu) {
        return;
    }

    const ordem = Array.from(
        menu.querySelectorAll(".menu-item")
    ).map(item =>
        item.dataset.url ||
        item.dataset.name ||
        ""
    );

    localStorage.setItem(
        MENU_ORDEM_STORAGE,
        JSON.stringify(ordem)
    );

}


function restaurarOrdemMenu() {

    const menu = document.querySelector(".menu");

    if (!menu) {
        return;
    }

    const ordemSalva =
        localStorage.getItem(MENU_ORDEM_STORAGE);

    if (!ordemSalva) {
        return;
    }

    try {

        const ordem = JSON.parse(ordemSalva);

        if (!Array.isArray(ordem)) {
            return;
        }

        const itens = Array.from(
            menu.querySelectorAll(".menu-item")
        );

        const mapa = new Map(
            itens.map(item => [
                item.dataset.url ||
                item.dataset.name ||
                "",
                item
            ])
        );

        ordem.forEach(chave => {

            const item = mapa.get(chave);

            if (item) {
                menu.appendChild(item);
                mapa.delete(chave);
            }

        });

        mapa.forEach(item => {
            menu.appendChild(item);
        });

    } catch (erro) {

        console.warn(
            "Não foi possível restaurar a ordem do menu.",
            erro
        );

    }

}


/* =====================================
   ATUALIZAR SISTEMA
====================================== */

function reloadSystem() {


    if (!currentUrl) {

        return;
    }


    const frame =
        document.getElementById("systemFrame");


    document
        .getElementById("loading")
        .classList.add("active");


    frame.src =
        comVersao(currentUrl);

}


/* =====================================
   ABRIR EM NOVA ABA
====================================== */

function openNewTab() {


    if (!currentUrl) {


        alert(
            "Selecione um sistema primeiro."
        );


        return;

    }


    window.open(
        currentUrl,
        "_blank"
    );

}


/* =====================================
   MENU MOBILE
====================================== */

function toggleSidebar() {


    document
        .getElementById("sidebar")
        .classList.toggle("open");

}


/* =====================================
   FECHAR MENU MOBILE AO CLICAR FORA
====================================== */

document.addEventListener(
    "click",
    function(event) {


        const sidebar =
            document.getElementById("sidebar");


        const menuButton =
            document.querySelector(
                ".mobile-menu-btn"
            );


        if (
            window.innerWidth <= 700 &&
            sidebar.classList.contains("open") &&
            !sidebar.contains(event.target) &&
            !menuButton.contains(event.target)
        ) {


            sidebar.classList.remove("open");

        }

    }
);

/* Inicializa a ordenação do menu */
document.addEventListener(
    "DOMContentLoaded",
    configurarOrdenacaoMenu
);


</script>

</body>
</html>
